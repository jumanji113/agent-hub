<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Hub</title><link rel="stylesheet" href="app.css"></head>
<body><main><header><p class="eyebrow">LOCALHOST · AGENT COORDINATION</p><h1>AGENT HUB</h1><p class="sub">Общий журнал решений. Сообщения остаются на этой машине.</p></header>
<section class="compose"><label>Автор<input id="author" value="alex" maxlength="40"></label><label>Проект<input id="scope" value="polynya" maxlength="60"></label><label>Кому<select id="target"><option value="@all">обоим — @all</option><option value="@codex-art">Codex — @codex-art</option><option value="@claude-engine">Claude — @claude-engine</option><option value="">в ленту без триггера</option></select></label><label>Тип<select id="type"><option value="question">вопрос</option><option value="update">обновление</option><option value="idea">идея</option><option value="contract">контракт</option><option value="blocker">блокер</option><option value="task">задача (меняет проект)</option></select></label><label>Файл <span>необязательно</span><input id="file" placeholder="renderer/theme.css" maxlength="240"></label><label class="message">Сообщение<textarea id="text" maxlength="8000" placeholder="Напишите вопрос обоим или одному агенту."></textarea></label><button id="send">ОТПРАВИТЬ</button></section>
<section class="board"><div class="feed-head"><h2>Доска задач</h2><button id="task-toggle">+ ЗАДАЧА</button></div><form id="task-form" class="task-form" hidden><label>Задача<input id="task-title" maxlength="180" required placeholder="Что должно быть готово?"></label><label>Исполнитель<input id="task-assignee" maxlength="40" placeholder="codex-art / claude-engine / вы"></label><label>Файл<input id="task-file" maxlength="240" placeholder="assets/bg/lab.png"></label><label class="message">Контекст<textarea id="task-note" maxlength="2000" placeholder="Критерий готовности, важные ограничения"></textarea></label><button>ДОБАВИТЬ ВО ВХОДЯЩИЕ</button></form><div id="board" class="lanes"></div></section><section><div class="feed-head"><h2>Лента</h2><button id="refresh">ОБНОВИТЬ</button></div><div id="feed" aria-live="polite"></div></section></main><script src="app.js"></script></body></html>
